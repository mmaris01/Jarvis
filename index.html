<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba JARVIS</title>
</head>

<body style="background:#050505;color:#00d9ff;text-align:center;padding-top:100px;font-family:Arial">

<h1>J.A.R.V.I.S.</h1>

<button id="boton" style="padding:20px;font-size:20px;">
🔊 PROBAR VOZ
</button>

<p id="texto">Pulsa el botón.</p>

<script>

const boton = document.getElementById("boton");
const texto = document.getElementById("texto");

boton.onclick = function() {

    texto.innerText = "Intentando hablar...";

    const mensaje =
        new SpeechSynthesisUtterance(
            "Hola señor. Soy Jarvis."
        );

    mensaje.lang = "es-ES";
    mensaje.volume = 1;
    mensaje.rate = 1;
    mensaje.pitch = 1;

    speechSynthesis.cancel();

    speechSynthesis.speak(mensaje);

};

</script>

</body>
</html>
