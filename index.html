<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle, #08232e 0%, #02070a 45%, #000 100%);
    color: #00d9ff;
    font-family: Arial, sans-serif;
}

.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 42px;
    letter-spacing: 10px;
    margin: 0;
    text-shadow: 0 0 25px #00d9ff;
}

.status {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 4px;
    opacity: .7;
}

.core {
    width: 260px;
    height: 260px;
    position: relative;
    margin: 35px 0;
}

.ring {
    position: absolute;
    border: 2px solid #00d9ff;
    border-radius: 50%;
    box-shadow: 0 0 15px #00d9ff;
}

.ring1 {
    width: 260px;
    height: 260px;
    animation: rotate 8s linear infinite;
    border-left-color: transparent;
    border-right-color: transparent;
}

.ring2 {
    width: 210px;
    height: 210px;
    top: 25px;
    left: 25px;
    animation: reverseRotate 5s linear infinite;
    border-top-color: transparent;
}

.ring3 {
    width: 155px;
    height: 155px;
    top: 52px;
    left: 52px;
    animation: rotate 3s linear infinite;
    border-bottom-color: transparent;
}

.center {
    position: absolute;
    width: 55px;
    height: 55px;
    top: 102px;
    left: 102px;
    border-radius: 50%;
    background: #00d9ff;

    box-shadow:
        0 0 20px #00d9ff,
        0 0 50px #00d9ff,
        0 0 100px #00d9ff;

    animation: pulse 1.5s infinite;
}

.listening .center {
    background: white;

    box-shadow:
        0 0 30px white,
        0 0 70px #00d9ff,
        0 0 120px #00d9ff;
}

button {
    padding: 17px 30px;

    border: 2px solid #00d9ff;
    border-radius: 40px;

    background: rgba(0,217,255,.05);

    color: #00d9ff;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 0 20px rgba(0,217,255,.3);
}

button:active {
    transform: scale(.95);
    background: #00d9ff;
    color: #001018;
}

.response {
    margin-top: 25px;
    width: 90%;
    max-width: 500px;

    font-size: 17px;
    line-height: 1.5;
}

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}

@keyframes reverseRotate {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }

}

@keyframes pulse {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }

}

</style>
</head>

<body>

<div class="container" id="jarvis">

    <h1>J.A.R.V.I.S.</h1>

    <div class="status" id="status">
        SISTEMA EN ESPERA
    </div>

    <div class="core">

        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="ring ring3"></div>

        <div class="center"></div>

    </div>

    <button id="talk">
        🎙️ ACTIVAR JARVIS
    </button>

    <div class="response" id="response">
        Esperando instrucciones, señor.
    </div>

</div>

   ELEMENTOS
